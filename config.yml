default:
  paths:
    uploads_dir: "uploads"
    results_dir: "results"
    database_dir: "database"
    sqlite_path: "database/app.sqlite"
  app:
    max_upload_mb: 200
    ai_enabled: false
  ai:
    provider: ""
    model: ""
    temperature: 0.2
    timeout_sec: 120
    prompt_version: "v0"
  llm:
    provider: "anthropic"
    base_url: "https://api.deepseek.com/anthropic"
    model: "deepseek-v4-flash"
    api_key_env: "DEEPSEEK_API_KEY"
    temperature: 0.2
    max_tokens: 4000
